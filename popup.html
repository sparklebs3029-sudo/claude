<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
body { width: 260px; padding: 16px; font-family: 'Malgun Gothic', sans-serif; background: #1e1e2e; color: #e0e0e0; margin: 0; }
h2 { font-size: 14px; margin: 0 0 4px; color: #fff; }
.sub { font-size: 11px; color: #555; margin-bottom: 12px; }
.btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; margin-bottom: 8px; font-weight: bold; }
.btn.blue { background: #2563eb; color: white; }
.btn.green { background: #16a34a; color: white; }
.btn.gray { background: #2a2a3e; color: #888; border: 1px solid #3b3b52; }
.section { background: #2a2a3e; border: 1px solid #3b3b52; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.section-title { font-size: 11px; color: #60a5fa; font-weight: bold; margin-bottom: 8px; }
.field { margin-bottom: 6px; }
.field label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }
.field input { width: 100%; padding: 5px 7px; background: #13131f; border: 1px solid #3b3b52; border-radius: 4px; color: #e0e0e0; font-size: 11px; font-family: inherit; box-sizing: border-box; }
.save-btn { width: 100%; padding: 6px; background: #3b3b52; border: none; border-radius: 4px; color: #e0e0e0; font-size: 11px; cursor: pointer; font-family: inherit; margin-top: 4px; }
.save-btn:hover { background: #4b4b62; }
.saved { font-size: 10px; color: #22c55e; text-align: center; margin-top: 4px; display: none; }
</style>
</head>
<body>
<h2>🖼 이미지수정</h2>
<p class="sub">샵플링 A4 이미지 편집 도구</p>

<div class="section">
  <div class="section-title">🔑 샵플링 API 설정</div>
  <div class="field">
    <label>로그인 ID</label>
    <input type="text" id="loginId" placeholder="샵플링 로그인 ID">
  </div>
  <div class="field">
    <label>고객사 ID (company_id)</label>
    <input type="text" id="companyId" placeholder="예: S1800950">
  </div>
  <div class="field">
    <label>API 인증키</label>
    <input type="password" id="apiKey" placeholder="API 인증키">
  </div>
  <div class="field">
    <label>다운로드 폴더명</label>
    <input type="text" id="folderName" placeholder="예: shopling_images">
  </div>
  <button class="save-btn" id="saveApiBtn">저장</button>
  <div class="saved" id="savedMsg">✓ 저장됐습니다</div>
</div>

<button class="btn blue" id="runOnPage">▶ 현재 탭에 이미지수정 실행</button>
<button class="btn green" id="openEditor">📂 편집기 바로 열기</button>
<button class="btn gray" id="openShopling">🔗 샵플링 A4 열기</button>
<script src="popup.js"></script>
</body>
</html>
